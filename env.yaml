name: warp-fwuav
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - pyyaml
  - matplotlib
  - pytest
  - pip:
      # If you want CUDA-enabled JAX, replace jaxlib with a CUDA build.
      # Example:
      # - --find-links https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
      # - jaxlib==0.4.28+cuda12.cudnn89
      # - jax==0.4.28
      - jax
      - jaxlib
      - warp-lang
      - xlb
      - -e .
